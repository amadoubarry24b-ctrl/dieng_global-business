<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Dieng Global Business</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:20px 15px;
  text-align:center;
}

header h1{
  font-size:23px;
}

header p{
  margin-top:6px;
  color:#bbb;
}

.container{
  max-width:650px;
  margin:auto;
  padding:20px 15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input[type="file"]{
  padding:10px;
}

.preview{
  width:100%;
  max-height:250px;
  object-fit:contain;
  margin-top:12px;
  border-radius:10px;
  display:none;
}

.main-button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.main-button:disabled{
  opacity:.6;
}

.secondary-button{
  width:100%;
  margin-top:8px;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#eee;
  font-weight:bold;
  cursor:pointer;
}

.logout-button{
  width:100%;
  margin-top:8px;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#ffdddd;
  color:#c00;
  font-weight:bold;
  cursor:pointer;
}

.cancel-button{
  width:100%;
  margin-top:8px;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#ddd;
  cursor:pointer;
  display:none;
}

.product-admin{
  display:flex;
  gap:12px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.product-admin img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:9px;
}

.product-details{
  flex:1;
}

.product-details strong{
  display:block;
  margin-bottom:5px;
}

.product-details span{
  color:#666;
  font-size:13px;
}

.actions{
  display:flex;
  gap:5px;
  margin-top:7px;
}

.actions button{
  border:0;
  padding:7px 9px;
  border-radius:6px;
  cursor:pointer;
}

.edit{
  background:#eee;
}

.delete{
  background:#ffdddd;
  color:#c00;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#111;
  font-weight:bold;
  text-decoration:none;
}

.empty,
.loading{
  text-align:center;
  color:#777;
  padding:20px;
}

/* CONNEXION */

#loginScreen{
  max-width:450px;
  margin:40px auto;
  padding:0 15px;
}

.login-card{
  background:white;
  padding:25px 20px;
  border-radius:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.10);
}

.login-card h2{
  text-align:center;
  margin-bottom:10px;
  font-size:30px;
}

.login-card p{
  text-align:center;
  color:#777;
  margin-bottom:20px;
}

.login-error{
  color:#c00;
  background:#ffeaea;
  padding:12px;
  border-radius:8px;
  margin-top:12px;
  display:none;
}

#adminContent{
  display:none;
}

.account-info{
  background:#f7f7f7;
  padding:12px;
  border-radius:9px;
  margin-bottom:15px;
  word-break:break-word;
}
</style>
</head>

<body>

<header>
  <h1>⚙️ DIENG GLOBAL BUSINESS</h1>
  <p>Administration des produits</p>
</header>


<!-- =========================
     CONNEXION
========================= -->

<div id="loginScreen">

  <div class="login-card">

    <h2>🔐 Administration</h2>

    <p>
      Connectez-vous pour gérer les produits.
    </p>

    <label>Adresse e-mail</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Votre adresse e-mail"
      autocomplete="email"
    >

    <label>Mot de passe</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Votre mot de passe"
      autocomplete="current-password"
    >

    <button
      type="button"
      class="main-button"
      id="loginButton"
      onclick="login()"
    >
      Se connecter
    </button>

    <div
      id="loginError"
      class="login-error"
    ></div>

  </div>

</div>


<!-- =========================
     ADMIN
========================= -->

<div id="adminContent">

<div class="container">


  <!-- COMPTE -->

  <div class="card">

    <h2>👤 Mon compte</h2>

    <div class="account-info">
      <strong>Connecté avec :</strong>
      <br>
      <span id="currentEmail"></span>
    </div>

    <button
      type="button"
      class="secondary-button"
      onclick="changePassword()"
    >
      🔑 Changer mon mot de passe
    </button>

    <button
      type="button"
      class="secondary-button"
      onclick="changeEmail()"
    >
      📧 Changer mon adresse e-mail
    </button>

    <button
      type="button"
      class="logout-button"
      onclick="logout()"
    >
      🚪 Se déconnecter
    </button>

  </div>


  <!-- PRODUIT -->

  <div class="card">

    <h2 id="formTitle">
      ➕ Ajouter un produit
    </h2>

    <label>Nom du produit</label>

    <input
      type="text"
      id="name"
      placeholder="Ex : iPhone 15 Pro"
    >

    <label>Catégorie</label>

    <select id="category">

      <option value="iPhone">🍎 iPhone</option>
      <option value="iPad">📱 iPad</option>
      <option value="MacBook">💻 MacBook</option>
      <option value="iMac">🖥️ iMac</option>
      <option value="Apple Watch">⌚ Apple Watch</option>
      <option value="AirPods">🎧 AirPods</option>
      <option value="AirTag">📍 AirTag</option>
      <option value="Samsung">📱 Samsung</option>
      <option value="Google Pixel">📱 Google Pixel</option>
      <option value="Tecno">📱 Tecno</option>
      <option value="Autres">📦 Autres</option>

    </select>

    <label>Prix (FCFA)</label>

    <input
      type="number"
      id="price"
      placeholder="Ex : 450000"
    >

    <label>Description</label>

    <textarea
      id="description"
      placeholder="Ex : iPhone 15 Pro, 256 Go, excellent état..."
    ></textarea>

    <label>Photo du produit</label>

    <input
      type="file"
      id="image"
      accept="image/*"
      onchange="previewImage(event)"
    >

    <img
      id="preview"
      class="preview"
      alt="Aperçu"
    >

    <button
      type="button"
      class="main-button"
      id="saveButton"
      onclick="saveProduct()"
    >
      Ajouter le produit
    </button>

    <button
      type="button"
      class="cancel-button"
      id="cancelButton"
      onclick="cancelEdit()"
    >
      Annuler la modification
    </button>

  </div>


  <!-- LISTE -->

  <div class="card">

    <h2>📦 Mes produits</h2>

    <div id="productList">
      <div class="loading">
        Chargement des produits...
      </div>
    </div>

  </div>


  <a class="back" href="index.html">
    ← Retour à la boutique
  </a>

</div>

</div>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://qumvvryatyoecjldeudh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_McDCwso7LMqsDCGpg5LC8Q_bG1UYBF6";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   VARIABLES
========================================== */

let products = [];
let editingId = null;
let currentImage = "";


/* ==========================================
   CONNEXION
========================================== */

async function login(){

  const email =
    document.getElementById("loginEmail")
    .value
    .trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  const button =
    document.getElementById("loginButton");

  const errorBox =
    document.getElementById("loginError");


  errorBox.style.display = "none";


  if(!email || !password){

    errorBox.textContent =
      "Veuillez entrer votre e-mail et votre mot de passe.";

    errorBox.style.display = "block";

    return;
  }


  button.disabled = true;
  button.textContent = "Connexion...";


  try{

    const { data, error } =
      await db.auth.signInWithPassword({
        email: email,
        password: password
      });


    if(error){

      console.error(error);

      errorBox.textContent =
        "E-mail ou mot de passe incorrect.";

      errorBox.style.display = "block";

      button.disabled = false;
      button.textContent = "Se connecter";

      return;
    }


    if(data && data.user){

      showAdmin(data.user);

    }else{

      errorBox.textContent =
        "Connexion impossible. Veuillez réessayer.";

      errorBox.style.display = "block";

    }

  }catch(error){

    console.error(error);

    errorBox.textContent =
      "Erreur de connexion : " + error.message;

    errorBox.style.display = "block";

  }


  button.disabled = false;
  button.textContent = "Se connecter";
}


/* ==========================================
   AFFICHER ADMIN
========================================== */

function showAdmin(user){

  document.getElementById("loginScreen")
    .style.display = "none";

  document.getElementById("adminContent")
    .style.display = "block";

  document.getElementById("currentEmail")
    .textContent = user.email || "";

  loadProducts();
}


/* ==========================================
   SESSION EXISTANTE
========================================== */

async function checkSession(){

  try{

    const { data, error } =
      await db.auth.getSession();

    if(error){

      console.error(error);
      return;
    }

    if(data.session){

      showAdmin(
        data.session.user
      );

    }

  }catch(error){

    console.error(error);

  }
}


/* ==========================================
   DÉCONNEXION
========================================== */

async function logout(){

  if(!confirm("Voulez-vous vous déconnecter ?")){
    return;
  }

  await db.auth.signOut();

  document.getElementById("adminContent")
    .style.display = "none";

  document.getElementById("loginScreen")
    .style.display = "block";

  document.getElementById("loginPassword")
    .value = "";

}


/* ==========================================
   CHANGER MOT DE PASSE
========================================== */

async function changePassword(){

  const newPassword =
    prompt("Entrez votre nouveau mot de passe :");


  if(!newPassword){
    return;
  }


  if(newPassword.length < 6){

    alert(
      "Le mot de passe doit contenir au moins 6 caractères."
    );

    return;
  }


  const { error } =
    await db.auth.updateUser({
      password: newPassword
    });


  if(error){

    alert(
      "Erreur : " + error.message
    );

    return;
  }


  alert(
    "✅ Votre mot de passe a été changé avec succès."
  );

}


/* ==========================================
   CHANGER EMAIL
========================================== */

async function changeEmail(){

  const newEmail =
    prompt(
      "Entrez votre nouvelle adresse e-mail :"
    );


  if(!newEmail){
    return;
  }


  const { error } =
    await db.auth.updateUser({
      email: newEmail.trim()
    });


  if(error){

    alert(
      "Erreur : " + error.message
    );

    return;
  }


  alert(
    "📧 Une confirmation peut être envoyée pour confirmer la nouvelle adresse."
  );

}


/* ==========================================
   APERÇU IMAGE
========================================== */

function previewImage(event){

  const file =
    event.target.files[0];

  if(!file){
    return;
  }


  const reader =
    new FileReader();


  reader.onload = function(e){

    currentImage =
      e.target.result;

    const preview =
      document.getElementById("preview");

    preview.src =
      currentImage;

    preview.style.display =
      "block";

  };


  reader.readAsDataURL(file);
}


/* ==========================================
   CHARGER PRODUITS
========================================== */

async function loadProducts(){

  const container =
    document.getElementById("productList");


  container.innerHTML =
    '<div class="loading">Chargement des produits...</div>';


  const { data, error } =
    await db
      .from("products")
      .select("*")
      .order("created_at", {
        ascending:false
      });


  if(error){

    console.error(error);

    container.innerHTML =
      '<div class="empty">Impossible de charger les produits.</div>';

    alert(
      "Erreur lors du chargement : " +
      error.message
    );

    return;
  }


  products =
    data || [];


  displayProducts();
}


/* ==========================================
   UPLOAD IMAGE
========================================== */

async function uploadImage(file){

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    crypto.randomUUID() +
    "." +
    extension;


  const { error } =
    await db.storage
      .from("product-images")
      .upload(
        fileName,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:file.type
        }
      );


  if(error){
    throw error;
  }


  const { data } =
    db.storage
      .from("product-images")
      .getPublicUrl(fileName);


  return data.publicUrl;
}


/* ==========================================
   ENREGISTRER PRODUIT
========================================== */

async function saveProduct(){

  const name =
    document.getElementById("name")
    .value
    .trim();

  const category =
    document.getElementById("category")
    .value;

  const price =
    Number(
      document.getElementById("price")
      .value
    );

  const description =
    document.getElementById("description")
    .value
    .trim();

  const imageFile =
    document.getElementById("image")
    .files[0];


  if(!name){

    alert(
      "Veuillez entrer le nom du produit."
    );

    return;
  }


  if(!price || price < 0){

    alert(
      "Veuillez entrer un prix valide."
    );

    return;
  }


  if(!imageFile && editingId === null){

    alert(
      "Veuillez choisir une photo."
    );

    return;
  }


  const button =
    document.getElementById("saveButton");


  button.disabled = true;
  button.textContent = "Enregistrement...";


  try{

    let imageUrl =
      currentImage;


    if(imageFile){

      imageUrl =
        await uploadImage(imageFile);

    }


    if(editingId !== null){

      const { error } =
        await db
          .from("products")
          .update({

            name: name,
            category: category,
            price: price,
            description: description,
            image_url: imageUrl,
            updated_at: new Date().toISOString()

          })
          .eq("id", editingId);


      if(error){
        throw error;
      }


      alert(
        "Produit modifié avec succès !"
      );

    }else{

      const { error } =
        await db
          .from("products")
          .insert({

            name: name,
            category: category,
            price: price,
            description: description,
            image_url: imageUrl,
            stock: 1

          });


      if(error){
        throw error;
      }


      alert(
        "Produit ajouté avec succès !"
      );
    }


    resetForm();

    await loadProducts();


  }catch(error){

    console.error(error);

    alert(
      "Une erreur est survenue : " +
      error.message
    );

  }


  button.disabled = false;

  button.textContent =
    editingId !== null
      ? "Enregistrer les modifications"
      : "Ajouter le produit";
}


/* ==========================================
   AFFICHER PRODUITS
========================================== */

function displayProducts(){

  const container =
    document.getElementById("productList");


  container.innerHTML = "";


  if(products.length === 0){

    container.innerHTML =
      '<div class="empty">Aucun produit ajouté pour le moment.</div>';

    return;
  }


  products.forEach(product => {

    const div =
      document.createElement("div");


    div.className =
      "product-admin";


    div.innerHTML = `

      <img
        src="${product.image_url || ""}"
        alt=""
      >

      <div class="product-details">

        <strong>
          ${escapeHTML(product.name)}
        </strong>

        <span>
          ${escapeHTML(product.category || "Autres")}
          •
          ${Number(product.price).toLocaleString()}
          FCFA
        </span>

        <div class="actions">

          <button
            type="button"
            class="edit"
            onclick="editProduct(${product.id})"
          >
            ✏️ Modifier
          </button>

          <button
            type="button"
            class="delete"
            onclick="deleteProduct(${product.id})"
          >
            🗑️ Supprimer
          </button>

        </div>

      </div>

    `;


    container.appendChild(div);

  });
}


/* ==========================================
   PROTECTION HTML
========================================== */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;
}


/* ==========================================
   MODIFIER
========================================== */

function editProduct(id){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product){
    return;
  }


  editingId =
    id;


  document.getElementById("name")
    .value = product.name;


  document.getElementById("category")
    .value = product.category;


  document.getElementById("price")
    .value = product.price;


  document.getElementById("description")
    .value = product.description || "";


  currentImage =
    product.image_url || "";


  const preview =
    document.getElementById("preview");


  preview.src =
    currentImage;


  preview.style.display =
    currentImage ? "block" : "none";


  document.getElementById("formTitle")
    .textContent =
    "✏️ Modifier le produit";


  document.getElementById("saveButton")
    .textContent =
    "Enregistrer les modifications";


  document.getElementById("cancelButton")
    .style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* ==========================================
   SUPPRIMER
========================================== */

async function deleteProduct(id){

  const product =
    products.find(
      p => p.id === id
    );


  if(!product){
    return;
  }


  if(!confirm(
    "Voulez-vous vraiment supprimer " +
    product.name +
    " ?"
  )){
    return;
  }


  const { error } =
    await db
      .from("products")
      .delete()
      .eq("id", id);


  if(error){

    console.error(error);

    alert(
      "Erreur lors de la suppression : " +
      error.message
    );

    return;
  }


  alert(
    "Produit supprimé avec succès !"
  );


  await loadProducts();
}


/* ==========================================
   ANNULER
========================================== */

function cancelEdit(){

  resetForm();
}


/* ==========================================
   RESET
========================================== */

function resetForm(){

  editingId = null;
  currentImage = "";


  document.getElementById("name")
    .value = "";

  document.getElementById("price")
    .value = "";

  document.getElementById("description")
    .value = "";

  document.getElementById("image")
    .value = "";


  document.getElementById("preview")
    .style.display = "none";


  document.getElementById("formTitle")
    .textContent =
    "➕ Ajouter un produit";


  document.getElementById("saveButton")
    .textContent =
    "Ajouter le produit";


  docume
