<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Dieng Global Business</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f5f5;color:#111}
header{background:#111;color:#fff;text-align:center;padding:20px 15px}
header h1{font-size:22px}
header p{color:#bbb;margin-top:6px}
.container,#loginScreen{max-width:650px;margin:auto;padding:20px 15px}
#loginScreen{max-width:450px;margin:35px auto}
.card,.login-card{background:#fff;padding:20px;border-radius:15px;margin-bottom:20px;box-shadow:0 3px 12px #00000012}
.login-card h2{text-align:center;margin-bottom:10px}
.login-card>p{text-align:center;color:#777;margin-bottom:20px}
label{display:block;font-weight:bold;margin:13px 0 6px}
input,select,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px}
textarea{min-height:100px}
button{cursor:pointer}
.main{width:100%;padding:14px;margin-top:18px;background:#111;color:#fff;border:0;border-radius:9px;font-size:16px;font-weight:bold}
.main:disabled{opacity:.6}
.secondary,.logout,.cancel{width:100%;padding:12px;margin-top:8px;border:0;border-radius:9px;font-weight:bold}
.secondary{background:#eee}
.logout{background:#ffdede;color:#c00}
.cancel{background:#ddd;display:none}
.msg{padding:11px;border-radius:8px;margin-top:12px;display:none}
.error{background:#ffeaea;color:#c00}
.success{background:#e8f8ed;color:#087a2d}
.account{background:#f7f7f7;padding:12px;border-radius:9px;margin-bottom:15px;word-break:break-word}
#adminContent{display:none}
.product{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.product img{width:70px;height:70px;object-fit:cover;border-radius:8px;background:#eee}
.details{flex:1}
.details strong{display:block;margin-bottom:5px}
.details small{color:#666}
.actions{display:flex;gap:5px;margin-top:7px}
.actions button{border:0;padding:7px;border-radius:6px}
.edit{background:#eee}
.del{background:#ffdede;color:#c00}
.preview{max-width:100%;max-height:220px;margin-top:10px;border-radius:10px;display:none}
.empty{text-align:center;color:#777;padding:20px}
.back{display:block;text-align:center;color:#111;font-weight:bold;margin:20px;text-decoration:none}
</style>
</head>

<body>

<header>
<h1>⚙️ DIENG GLOBAL BUSINESS</h1>
<p>Administration des produits</p>
</header>

<!-- CONNEXION -->
<div id="loginScreen">
<div class="login-card">

<h2>🔐 Administration</h2>
<p>Connectez-vous pour gérer les produits.</p>

<label>Adresse e-mail</label>
<input id="loginEmail" type="email" placeholder="Votre adresse e-mail" autocomplete="email">

<label>Mot de passe</label>
<input id="loginPassword" type="password" placeholder="Votre mot de passe" autocomplete="current-password">

<button class="main" id="loginButton" onclick="login()">Se connecter</button>

<div id="loginError" class="msg error"></div>
<div id="loginSuccess" class="msg success"></div>

</div>
</div>


<!-- ADMIN -->
<div id="adminContent">
<div class="container">

<!-- COMPTE -->
<div class="card">
<h2>👤 Mon compte</h2>

<div class="account">
<strong>Connecté avec :</strong><br>
<span id="currentEmail"></span>
</div>

<button class="secondary" onclick="changePassword()">🔑 Changer mon mot de passe</button>
<button class="secondary" onclick="changeEmail()">📧 Changer mon adresse e-mail</button>
<button class="logout" onclick="logout()">🚪 Se déconnecter</button>
</div>


<!-- PRODUIT -->
<div class="card">

<h2 id="formTitle">➕ Ajouter un produit</h2>

<label>Nom du produit</label>
<input id="name" type="text" placeholder="Ex : iPhone 15 Pro">

<label>Catégorie</label>
<select id="category">
<option>iPhone</option>
<option>iPad</option>
<option>MacBook</option>
<option>iMac</option>
<option>Apple Watch</option>
<option>AirPods</option>
<option>AirTag</option>
<option>Samsung</option>
<option>Google Pixel</option>
<option>Tecno</option>
<option>Autres</option>
</select>

<label>Prix (FCFA)</label>
<input id="price" type="number" min="0" placeholder="Ex : 450000">

<label>Description</label>
<textarea id="description" placeholder="Description du produit"></textarea>

<label>Photo du produit</label>
<input id="image" type="file" accept="image/*" onchange="previewImage(event)">

<img id="preview" class="preview">

<button id="saveButton" class="main" onclick="saveProduct()">Ajouter le produit</button>
<button id="cancelButton" class="cancel" onclick="cancelEdit()">Annuler la modification</button>

</div>


<!-- PRODUITS -->
<div class="card">
<h2>📦 Mes produits</h2>
<div id="productList">Chargement...</div>
</div>

<a class="back" href="index.html">← Retour à la boutique</a>

</div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* SUPABASE */
const SUPABASE_URL="https://qumvvryatyoecjldeudh.supabase.co";
const SUPABASE_KEY="sb_publishable_McDCwso7LMqsDCGpg5LC8Q_bG1UYBF6";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let products=[];
let editingId=null;
let currentImage="";


/* CONNEXION */
async function login(){

const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;
const btn=document.getElementById("loginButton");
const err=document.getElementById("loginError");
const ok=document.getElementById("loginSuccess");

err.style.display="none";
ok.style.display="none";

if(!email||!password){
err.textContent="Veuillez entrer votre e-mail et votre mot de passe.";
err.style.display="block";
return;
}

btn.disabled=true;
btn.textContent="Connexion...";

try{

const {data,error}=await db.auth.signInWithPassword({
email:email,
password:password
});

if(error){
err.textContent="❌ "+error.message;
err.style.display="block";
return;
}

if(data&&data.user){
ok.textContent="✅ Connexion réussie !";
ok.style.display="block";
showAdmin(data.user);
}

}catch(e){
err.textContent="❌ Erreur : "+e.message;
err.style.display="block";
}finally{
btn.disabled=false;
btn.textContent="Se connecter";
}

}


/* AFFICHER ADMIN */
function showAdmin(user){

document.getElementById("loginScreen").style.display="none";
document.getElementById("adminContent").style.display="block";
document.getElementById("currentEmail").textContent=user.email||"";
loadProducts();

}


/* VERIFIER SESSION */
async function checkSession(){

try{

const {data,error}=await db.auth.getSession();

if(error){
console.error(error);
return;
}

if(data.session&&data.session.user){
showAdmin(data.session.user);
}

}catch(e){
console.error(e);
}

}


/* DECONNEXION */
async function logout(){

if(!confirm("Voulez-vous vraiment vous déconnecter ?"))return;

const {error}=await db.auth.signOut();

if(error){
alert("Erreur : "+error.message);
return;
}

document.getElementById("adminContent").style.display="none";
document.getElementById("loginScreen").style.display="block";
document.getElementById("loginPassword").value="";

}


/* CHANGER MOT DE PASSE */
async function changePassword(){

const password=prompt("Entrez votre nouveau mot de passe :");

if(!password)return;

if(password.length<6){
alert("Le mot de passe doit contenir au moins 6 caractères.");
return;
}

const {error}=await db.auth.updateUser({password:password});

if(error)alert("Erreur : "+error.message);
else alert("✅ Mot de passe changé avec succès.");

}


/* CHANGER EMAIL */
async function changeEmail(){

const email=prompt("Entrez votre nouvelle adresse e-mail :");

if(!email)return;

const {error}=await db.auth.updateUser({email:email.trim()});

if(error)alert("Erreur : "+error.message);
else alert("📧 Demande de changement d'e-mail envoyée.");

}


/* APERCU IMAGE */
function previewImage(e){

const file=e.target.files[0];

if(!file)return;

if(!file.type.startsWith("image/")){
alert("Veuillez choisir une image.");
return;
}

const reader=new FileReader();

reader.onload=function(x){
currentImage=x.target.result;
const p=document.getElementById("preview");
p.src=currentImage;
p.style.display="block";
};

reader.readAsDataURL(file);

}


/* CHARGER PRODUITS */
async function loadProducts(){

const box=document.getElementById("productList");
box.innerHTML="Chargement...";

const {data,error}=await db
.from("products")
.select("*")
.order("created_at",{ascending:false});

if(error){
console.error(error);
box.innerHTML='<div class="empty">Impossible de charger les produits.</div>';
return;
}

products=data||[];
displayProducts();

}


/* AFFICHER PRODUITS */
function displayProducts(){

const box=document.getElementById("productList");

if(!products.length){
box.innerHTML='<div class="empty">Aucun produit pour le moment.</div>';
return;
}

box.innerHTML="";

products.forEach(p=>{

const div=document.createElement("div");
div.className="product";

const img=document.createElement("img");
img.src=p.image_url||"";
img.alt=p.name||"Produit";

const details=document.createElement("div");
details.className="details";

const title=document.createElement("strong");
title.textContent=p.name||"Sans nom";

const info=document.createElement("small");
info.textContent=(p.category||"")+
" • "+Number(p.price||0).toLocaleString("fr-FR")+
" FCFA";

const actions=document.createElement("div");
actions.className="actions";

const edit=document.createElement("button");
edit.className="edit";
edit.textContent="✏️ Modifier";
edit.onclick=()=>editProduct(p.id);

const del=document.createElement("button");
del.className="del";
del.textContent="🗑️ Supprimer";
del.onclick=()=>deleteProduct(p.id);

actions.append(edit,del);
details.append(title,info,actions);
div.append(img,details);
box.appendChild(div);

});

}


/* UPLOAD IMAGE */
async function uploadImage(file){

const ext=file.name.split(".").pop().toLowerCase();
const name=crypto.randomUUID()+"."+ext;

const {error}=await db.storage
.from("product-images")
.upload(name,file,{
cacheControl:"3600",
upsert:false,
contentType:file.type
});

if(error)throw error;

const {data}=db.storage
.from("product-images")
.getPublicUrl(name);

return data.publicUrl;

}


/* AJOUT / MODIFICATION */
async function saveProduct(){

const name=document.getElementById("name").value.trim();
const category=document.getElementById("category").value;
const priceValue=document.getElementById("price").value;
const price=Number(priceValue);
const description=document.getElementById("description").value.trim();
const file=document.getElementById("image").files[0];
const btn=document.getElementById("saveButton");

if(!name){
alert("Veuillez entrer le nom du produit.");
return;
}

if(priceValue===""||isNaN(price)||price<0){
alert("Veuillez entrer un prix valide.");
return;
}

if(!file&&!currentImage){
alert("Veuillez choisir une photo.");
return;
}

btn.disabled=true;
btn.textContent="Enregistrement...";

try{

let imageUrl=currentImage;

if(file){
imageUrl=await uploadImage(file);
}

if(editingId){

const {error}=await db
.from("products")
.update({
name:name,
category:category,
price:price,
description:description,
image_url:imageUrl
})
.eq("id",editingId);

if(error)throw error;

alert("✅ Produit modifié avec succès !");

}else{

const {error}=await db
.from("products")
.insert({
name:name,
category:category,
price:price,
description:description,
image_url:imageUrl,
stock:1
});

if(error)throw error;

alert("✅ Produit ajouté avec succès !");

}

resetForm();
await loadProducts();

}catch(e){

console.error(e);
alert("❌ Erreur : "+e.message);

}finally{

btn.disabled=false;
btn.textContent=editingId
?"Enregistrer les modifications"
:"Ajouter le produit";

}

}


/* MODIFIER */
function editProduct(id){

const p=products.find(x=>String(x.id)===String(id));

if(!p)return;

editingId=p.id;

document.getElementById("name").value=p.name||"";
document.getElementById("category").value=p.category||"Autres";
document.getElementById("price").value=p.price||"";
document.getElementById("description").value=p.description||"";

currentImage=p.image_url||"";

const preview=document.getElementById("preview");

if(currentImage){
preview.src=currentImage;
preview.style.display="block";
}

document.getElementById("formTitle").textContent="✏️ Modifier le produit";
document.getElementById("saveButton").textContent="Enregistrer les modifications";
document.getElementById("cancelButton").style.display="block";

window.scrollTo({top:0,behavior:"smooth"});

}


/* SUPPRIMER */
async function deleteProduct(id){

const p=products.find(x=>String(x.id)===String(id));

if(!p)return;

if(!confirm('Supprimer "'+p.name+' " ?'))return;

const {error}=await db
.from("products")
.delete()
.eq("id",id);

if(error){
alert("❌ Erreur : "+error.message);
return;
}

alert("✅ Produit supprimé !");
loadProducts();

}


/* ANNULER */
function cancelEdit(){
resetForm();
}


/* RESET */
function resetForm(){

editingId=null;
currentImage="";

document.getElementById("name").value="";
document.getElementById("category").value="iPhone";
document.getElementById("price").value="";
document.getElementById("description").value="";
document.getElementById("image").value="";

const p=document.getElementById("preview");
p.src="";
p.style.display="none";

document.getElementById("formTitle").textContent="➕ Ajouter un produit";
document.getElementById("saveButton").textContent="Ajouter le produit";
document.getElementById("cancelButton").style.display="none";

}


/* DEMARRAGE */
document.addEventListener("DOMContentLoaded",checkSession);

</script>
</body>
  </html>
