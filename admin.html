<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - Dieng Global Business</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:20px 15px;
  text-align:center;
}

header h1{
  font-size:23px;
}

header p{
  margin-top:6px;
  color:#bbb;
}

.container{
  max-width:650px;
  margin:auto;
  padding:20px 15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:7px;
}

input,
select,
textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:9px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input[type="file"]{
  padding:10px;
}

.preview{
  width:100%;
  max-height:250px;
  object-fit:contain;
  margin-top:12px;
  border-radius:10px;
  display:none;
}

.main-button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#111;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.main-button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.cancel-button{
  width:100%;
  margin-top:8px;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#ddd;
  cursor:pointer;
  display:none;
}

.product-admin{
  display:flex;
  gap:12px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.product-admin img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:9px;
}

.product-details{
  flex:1;
}

.product-details strong{
  display:block;
  margin-bottom:5px;
}

.product-details span{
  color:#666;
  font-size:13px;
}

.actions{
  display:flex;
  gap:5px;
  margin-top:7px;
}

.actions button{
  border:0;
  padding:7px 9px;
  border-radius:6px;
  cursor:pointer;
}

.edit{
  background:#eee;
}

.delete{
  background:#ffdddd;
  color:#c00;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#111;
  font-weight:bold;
  text-decoration:none;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

.loading{
  text-align:center;
  color:#777;
  padding:20px;
}

</style>
</head>

<body>

<header>
  <h1>⚙️ DIENG GLOBAL BUSINESS</h1>
  <p>Administration des produits</p>
</header>

<div class="container">

  <!-- AJOUTER UN PRODUIT -->

  <div class="card">

    <h2 id="formTitle">➕ Ajouter un produit</h2>

    <label>Nom du produit</label>

    <input
      type="text"
      id="name"
      placeholder="Ex : iPhone 15 Pro"
    >

    <label>Catégorie</label>

    <select id="category">

      <option value="iPhone">🍎 iPhone</option>
      <option value="iPad">📱 iPad</option>
      <option value="MacBook">💻 MacBook</option>
      <option value="iMac">🖥️ iMac</option>
      <option value="Apple Watch">⌚ Apple Watch</option>
      <option value="AirPods">🎧 AirPods</option>
      <option value="AirTag">📍 AirTag</option>
      <option value="Samsung">📱 Samsung</option>
      <option value="Google Pixel">📱 Google Pixel</option>
      <option value="Tecno">📱 Tecno</option>
      <option value="Autres">📦 Autres</option>

    </select>

    <label>Prix (FCFA)</label>

    <input
      type="number"
      id="price"
      placeholder="Ex : 450000"
    >

    <label>Description</label>

    <textarea
      id="description"
      placeholder="Ex : iPhone 15 Pro, 256 Go, excellent état..."
    ></textarea>

    <label>Photo du produit</label>

    <input
      type="file"
      id="image"
      accept="image/*"
      onchange="previewImage(event)"
    >

    <img
      id="preview"
      class="preview"
      alt="Aperçu"
    >

    <button
      class="main-button"
      onclick="saveProduct()"
      id="saveButton"
    >
      Ajouter le produit
    </button>

    <button
      class="cancel-button"
      onclick="cancelEdit()"
      id="cancelButton"
    >
      Annuler la modification
    </button>

  </div>


  <!-- LISTE DES PRODUITS -->

  <div class="card">

    <h2>📦 Mes produits</h2>

    <div id="productList">

      <div class="loading">
        Chargement des produits...
      </div>

    </div>

  </div>

  <a class="back" href="index.html">
    ← Retour à la boutique
  </a>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
  "https://qumvvryatyoecjldeudh.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_McDCwso7LMqsDCGpg5LC8Q_bG1UYBF6";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   VARIABLES
========================================== */

let products = [];

let editingId = null;

let currentImage = "";


/* ==========================================
   APERÇU IMAGE
========================================== */

function previewImage(event){

  const file =
    event.target.files[0];

  if(!file) return;

  const reader =
    new FileReader();

  reader.onload = function(e){

    currentImage =
      e.target.result;

    const preview =
      document.getElementById("preview");

    preview.src =
      currentImage;

    preview.style.display =
      "block";

  };

  reader.readAsDataURL(file);

}


/* ==========================================
   CHARGER LES PRODUITS
========================================== */

async function loadProducts(){

  const { data, error } =
    await db
      .from("products")
      .select("*")
      .order("created_at", {
        ascending:false
      });

  if(error){

    console.error(error);

    alert(
      "Erreur lors du chargement : "
      + error.message
    );

    return;

  }

  products =
    data || [];

  displayProducts();

}


/* ==========================================
   UPLOAD IMAGE
========================================== */

async function uploadImage(file){

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();

  const fileName =
    crypto.randomUUID()
    + "."
    + extension;

  const { error } =
    await db.storage
      .from("product-images")
      .upload(
        fileName,
        file,
        {
          cacheControl:"3600",
          upsert:false,
          contentType:file.type
        }
      );

  if(error){

    console.error(error);

    throw error;

  }

  const { data } =
    db.storage
      .from("product-images")
      .getPublicUrl(fileName);

  return data.publicUrl;

}


/* ==========================================
   ENREGISTRER LE PRODUIT
========================================== */

async function saveProduct(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();

  const category =
    document
      .getElementById("category")
      .value;

  const price =
    Number(
      document
        .getElementById("price")
        .value
    );

  const description =
    document
      .getElementById("description")
      .value
      .trim();

  const imageFile =
    document
      .getElementById("image")
      .files[0];


  /* VALIDATION */

  if(!name){

    alert(
      "Veuillez entrer le nom du produit."
    );

    return;

  }

  if(!price || price < 0){

    alert(
      "Veuillez entrer un prix valide."
    );

    return;

  }

  if(
    !imageFile &&
    editingId === null
  ){

    alert(
      "Veuillez choisir une photo."
    );

    return;

  }


  const button =
    document.getElementById(
      "saveButton"
    );

  button.disabled = true;

  button.textContent =
    "Enregistrement...";


  try{

    let imageUrl =
      currentImage;


    /* IMAGE */

    if(imageFile){

      imageUrl =
        await uploadImage(
          imageFile
        );

    }


    /* MODIFICATION */

    if(editingId !== null){

      const { error } =
        await db
          .from("products")
          .update({

            name:name,

            category:category,

            price:price,

            description:description,

            image_url:imageUrl,

            updated_at:
              new Date().toISOString()

          })
          .eq(
            "id",
            editingId
          );

      if(error)
        throw error;

      alert(
        "Produit modifié avec succès !"
      );

    }


    /* AJOUT */

    else{

      const { error } =
        await db
          .from("products")
          .insert({

            name:name,

            category:category,

            price:price,

            description:description,

            image_url:imageUrl,

            stock:1

          });

      if(error)
        throw error;

      alert(
        "Produit ajouté avec succès !"
      );

    }


    resetForm();

    await loadProducts();

  }

  catch(error){

    console.error(error);

    alert(
      "Une erreur est survenue : "
      + error.message
    );

  }


  button.disabled =
    false;

  button.textContent =
    editingId !== null
      ? "Enregistrer les modifications"
      : "Ajouter le produit";

}


/* ==========================================
   AFFICHER LES PRODUITS
========================================== */

function displayProducts(){

  const container =
    document.getElementById(
      "productList"
    );

  container.innerHTML = "";


  if(products.length === 0){

    container.innerHTML =
      '<div class="empty">Aucun produit ajouté pour le moment.</div>';

    return;

  }


  products.forEach(product => {

    const div =
      document.createElement("div");

    div.className =
      "product-admin";


    div.innerHTML = `

      <img
        src="${product.image_url || ""}"
        alt=""
      >

      <div class="product-details">

        <strong>
          ${escapeHTML(product.name)}
        </strong>

        <span>
          ${escapeHTML(
            product.category || "Autres"
          )}
          •
          ${Number(
            product.price
          ).toLocaleString()}
          FCFA
        </span>

        <div class="actions">

          <button
            class="edit"
            onclick="editProduct(${product.id})"
          >
            ✏️ Modifier
          </button>

          <button
            class="delete"
            onclick="deleteProduct(${product.id})"
          >
            🗑️ Supprimer
          </button>

        </div>

      </div>

    `;

    container.appendChild(div);

  });

}


/* ==========================================
   PROTECTION HTML
========================================== */

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text || "";

  return div.innerHTML;

}


/* ==========================================
   MODIFIER
========================================== */

function editProduct(id){

  const product =
    products.find(
      p => p.id === id
    );

  if(!product) return;


  editingId =
    id;


  document.getElementById("name").value =
    product.name;


  document.getElementById("category").value =
    product.category;


  document.getElementById("price").value =
    product.price;


  document.getElementById("description").value =
    product.description || "";


  currentImage =
    product.image_url || "";


  const preview =
    document.getElementById("preview");


  preview.src =
    currentImage;


  preview.style.display =
    currentImage
      ? "block"
      : "none";


  document.getElementById("formTitle")
    .textContent =
    "✏️ Modifier le produit";


  document.getElementById("saveButton")
    .textContent =
    "Enregistrer les modifications";


  document.getElementById("cancelButton")
    .style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==========================================
   SUPPRIMER
========================================== */

async function deleteProduct(id){

  const product =
    products.find(
      p => p.id === id
    );

  if(!product) return;


  const confirmation =
    confirm(
      "Voulez-vous vraiment supprimer "
      + product.name
      + " ?"
    );


  if(!confirmation)
    return;


  const { error } =
    await db
      .from("products")
      .delete()
      .eq("id", id);


  if(error){

    console.error(error);

    alert(
      "Erreur lors de la suppression : "
      + error.message
    );

    return;

  }


  alert(
    "Produit supprimé avec succès !"
  );


  await loadProducts();

}


/* ==========================================
   ANNULER
========================================== */

function cancelEdit(){

  resetForm();

}


/* ==========================================
   RÉINITIALISER
========================================== */

function resetForm(){

  editingId = null;

  currentImage = "";


  document.getElementById("name")
    .value = "";

  document.getElementById("price")
    .value = "";

  document.getElementById("description")
    .value = "";

  document.getElementById("image")
    .value = "";


  document.getElementById("preview")
    .style.display = "none";


  document.getElementById("formTitle")
    .textContent =
    "➕ Ajouter un produit";


  document.getElementById("saveButton")
    .textContent =
    "Ajouter le produit";


  document.getElementById("cancelButton")
    .style.display =
    "none";

}


/* ==========================================
   DÉMARRAGE
========================================== */

loadProducts();

</script>

</body>
  </html>
